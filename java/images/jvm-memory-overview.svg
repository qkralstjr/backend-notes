<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">JVM 메모리 구조</title>
  <desc id="description">모든 스레드가 공유하는 Heap과 Method Area, 스레드마다 생성되는 JVM Stack, PC Register, Native Method Stack을 구분한 다이어그램</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>

  <text x="600" y="62" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="32" font-weight="700" fill="#0f172a">JVM 메모리 구조</text>
  <text x="600" y="98" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#64748b">공유 여부를 기준으로 나눈 메모리 영역</text>

  <g filter="url(#shadow)">
    <rect x="60" y="135" width="520" height="510" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="620" y="135" width="520" height="510" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  </g>

  <text x="320" y="184" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" fill="#1d4ed8">모든 스레드가 공유</text>
  <text x="320" y="214" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#3b82f6">프로그램 전체에서 함께 사용하는 영역</text>

  <g>
    <rect x="100" y="252" width="440" height="140" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="138" cy="292" r="16" fill="#dbeafe"/>
    <text x="138" y="299" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700" fill="#2563eb">H</text>
    <text x="170" y="300" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Heap</text>
    <text x="138" y="340" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#334155">객체와 배열 저장</text>
    <text x="138" y="369" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#64748b">더 이상 사용하지 않는 객체는 GC 대상</text>
  </g>

  <g>
    <rect x="100" y="424" width="440" height="140" rx="16" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="138" cy="464" r="16" fill="#dbeafe"/>
    <text x="138" y="471" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700" fill="#2563eb">M</text>
    <text x="170" y="472" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="23" font-weight="700" fill="#0f172a">Method Area</text>
    <text x="138" y="512" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17" fill="#334155">클래스와 메서드 정보 저장</text>
    <text x="138" y="541" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#64748b">HotSpot JVM에서는 Metaspace로 구현</text>
  </g>

  <text x="880" y="184" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="700" fill="#15803d">스레드마다 따로 생성</text>
  <text x="880" y="214" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#22c55e">각 스레드의 실행 상태를 따로 관리하는 영역</text>

  <g>
    <rect x="660" y="252" width="440" height="98" rx="16" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="700" y="291" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#0f172a">JVM Stack</text>
    <text x="700" y="322" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#475569">메서드 실행 정보와 지역 변수 저장</text>
  </g>

  <g>
    <rect x="660" y="374" width="440" height="98" rx="16" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="700" y="413" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#0f172a">PC Register</text>
    <text x="700" y="444" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#475569">현재 실행 중인 명령어 위치 저장</text>
  </g>

  <g>
    <rect x="660" y="496" width="440" height="98" rx="16" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
    <text x="700" y="535" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Native Method Stack</text>
    <text x="700" y="566" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" fill="#475569">네이티브 메서드 실행 정보 저장</text>
  </g>

  <text x="600" y="687" text-anchor="middle" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="15" fill="#64748b">공유 영역은 데이터 공유에 적합하고, 스레드별 영역은 실행 상태를 독립적으로 유지</text>
</svg>
